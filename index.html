<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sudoku</h1>

        <div class="controls">
            <button id="btn-easy" class="diff-btn">Easy</button>
            <button id="btn-medium" class="diff-btn">Medium</button>
            <button id="btn-hard" class="diff-btn">Hard</button>
        </div>

        <div class="status-bar">
            <span id="timer" class="timer">00:00</span>
            <span id="mistakes" class="mistakes">Mistakes: 0</span>
            <span id="hints" class="hints">Hints: 0</span>
        </div>

        <div id="board" class="board"></div>

        <div class="number-pad">
            <button class="num-btn" data-num="1">1</button>
            <button class="num-btn" data-num="2">2</button>
            <button class="num-btn" data-num="3">3</button>
            <button class="num-btn" data-num="4">4</button>
            <button class="num-btn" data-num="5">5</button>
            <button class="num-btn" data-num="6">6</button>
            <button class="num-btn" data-num="7">7</button>
            <button class="num-btn" data-num="8">8</button>
            <button class="num-btn" data-num="9">9</button>
        </div>

        <div class="action-buttons">
            <button id="btn-undo" class="action-btn">Undo</button>
            <button id="btn-clear" class="action-btn">Clear</button>
            <button id="btn-pencil" class="action-btn pencil-btn">🖊️ Pen</button>
            <button id="btn-hint" class="action-btn hint-btn">💡 Hint</button>
        </div>

        <div id="hint-message" class="hint-message hidden">Fix conflicts first</div>

        <div id="win-banner" class="win-banner hidden">
            <p>🎉 You solved it!</p>
            <div class="win-stats">
                <div class="win-stat-row">
                    <span class="win-stat-label">Time</span>
                    <span id="win-time" class="win-stat-value">00:00</span>
                </div>
                <div class="win-stat-row">
                    <span class="win-stat-label">Mistakes</span>
                    <span id="win-mistakes" class="win-stat-value">0</span>
                </div>
                <div class="win-stat-row win-score-row">
                    <span class="win-stat-label">Score</span>
                    <span id="win-score" class="win-stat-value">0</span>
                </div>
                <div class="win-stat-row win-best-row">
                    <span class="win-stat-label">Best</span>
                    <span id="win-best" class="win-stat-value">0</span>
                </div>
            </div>
            <button id="btn-new-game" class="action-btn">New Game</button>
        </div>
    </div>

    <script src="generator.js"></script>
    <script src="storage.js"></script>
    <script src="serialize.js"></script>
    <script src="scoring.js"></script>
    <script src="script.js"></script>
</body>
</html>
